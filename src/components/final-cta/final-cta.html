<!-- ==========================================================================
     COMPONENT: final-cta  (closing section of the site)
     --------------------------------------------------------------------------
     A simple closing call to action: the copy (subtext, download button,
     micro-copy). Pressing "Download Voydnet" starts the download AND routes to
     the /download "Thank you" screen, which now hosts the closing video.

     Copy is referenced by key (data-i18n) and filled from the content
     registry; the CTA button is built by the shared button factory in the
     controller.
     ========================================================================== -->
<section class="fcta" data-component="final-cta">

  <!-- Centred lead image, sits above the closing copy. Source is set by the
       controller from the asset registry. -->
  <div class="fcta__media">
    <img class="fcta__image" data-slot="image" alt="" loading="lazy" decoding="async" />
  </div>

  <!-- Copy -->
  <div class="fcta__content">
    <p class="fcta__subtext" data-i18n="cta.subtext"></p>
    <div class="fcta__cta" data-slot="cta"></div>
    <p class="fcta__microcopy" data-i18n="cta.microcopy"></p>

    <!-- Quiet legal footer link. Plain hash anchor keeps it framework-free
         and consistent with the site-nav brand link (href="#/"). -->
    <nav class="fcta__legal" aria-label="Legal">
      <a class="fcta__legal-link" href="#/Privacy&Policy">Privacy Policy</a>
      <a class="fcta__legal-link" href="#/terms">Terms of Service</a>
    </nav>
  </div>

</section>
