<!-- ==========================================================================
     COMPONENT: hero  (the first section of the site)
     --------------------------------------------------------------------------
     A clean, elegant, creamy-white opening: a large Times New Roman headline,
     a calm supporting paragraph, and a single primary call-to-action.

     All copy is referenced by key via data-i18n and filled in at runtime from
     the content registry (src/content/strings.*.html), so wording and future
     translations live entirely outside this markup. The CTA button itself is
     built by the shared button factory and injected into [data-slot="cta"].
     ========================================================================== -->
<section class="hero" data-component="hero">
  <div class="hero__inner">

    <!-- LEFT: copy + call to action.
         The headline is split into per-line reveal targets by hero.js after
         hydration; subtext + CTA rise in just after, so the whole block
         cascades into view on load. -->
    <div class="hero__copy">
      <h1 class="hero__headline" data-i18n="hero.headline"></h1>
      <p class="hero__subtext" data-reveal="up" style="--reveal-index:3" data-i18n="hero.subtext"></p>
      <div class="hero__cta" data-reveal="up" style="--reveal-index:4" data-slot="cta"></div>
    </div>

    <!-- RIGHT: the intro illustration. On load it pops up smoothly from its
         baseline (bottom → top), then breathes with a gentle float. The image
         source is set at runtime by hero.js from the asset registry
         (data-slot="image"). -->
    <div class="hero__stage hero__stage--rise" data-reveal="up" style="--reveal-index:2">
      <div class="hero__glow" aria-hidden="true"></div>
      <img class="hero__image" data-slot="image" alt="" />
    </div>

  </div>
</section>
