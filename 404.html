<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voydnet</title>
  <!--
    SPA fallback for static hosts (GitHub Pages / Cloudflare Pages).
    We use hash routing (#/route), so the app itself always lives at the site
    root. If a visitor lands on an unknown path, bounce them to the app root
    while preserving any hash. This keeps deep links and typos from dead-ending.
  -->
  <script>
    (function () {
      // Resolve the site root whether hosted at a domain root or a /repo/ subpath.
      // On GitHub project pages the first path segment is the repo name.
      var seg = location.pathname.split("/").filter(Boolean);
      var isProjectPage = location.hostname.endsWith("github.io") && seg.length > 0;
      var root = isProjectPage ? "/" + seg[0] + "/" : "/";
      location.replace(root + (location.hash || ""));
    })();
  </script>
</head>
<body></body>
</html>
